<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rakshasutra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
  :root{--bg:#11161c;--card:#1a212a;--line:#2b3541;--text:#e4e8ec;--muted:#98a3b0;--accent:#8fb0ac;--ink:#0e1417;
        --ok:#4f7d66;--warn:#9a8545;--bad:#a15a5a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:1.1875rem/1.6 'Noto Sans','Noto Sans Devanagari',system-ui,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  header div{display:flex;gap:8px;align-items:center}
  h1{font-size:1.25rem;margin:0;font-weight:600}
  h2{font-size:1.1rem;margin:0 0 4px;font-weight:600}
  main{max-width:640px;margin:auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
  .card.lvl0{border-left:6px solid var(--ok)} .card.lvl1{border-left:6px solid var(--warn)} .card.lvl2{border-left:6px solid var(--bad)}
  .center{text-align:center}
  .sub,.note{color:var(--muted);font-size:.85rem;margin:0}
  label{display:block;margin:12px 0 0}
  input:not([type=checkbox]):not([type=radio]),select{width:100%;min-height:52px;margin-top:4px;padding:8px 12px;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px}
  header select{width:auto;min-height:44px;margin:0}
  .chk{display:flex;gap:10px;align-items:center;min-height:44px}
  .chk input{width:22px;height:22px}
  fieldset{border:0;padding:0;margin:16px 0 0} legend{color:var(--muted);padding:0}
  button{font:inherit;min-height:52px;padding:0 20px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
  .primary{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:600;width:100%;margin-top:16px}
  .ghost{background:transparent;color:var(--text);min-height:44px}
  .big{min-height:64px}
  .sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
  .s{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0;padding:10px;border:2px solid var(--line);border-radius:10px;cursor:pointer;text-align:center}
  .s input{position:absolute;opacity:0}
  .s:has(input:checked){border-color:var(--accent);background:#222b36}
  .s:has(input:focus-visible){outline:3px solid #c9d6d4}
  .chip{width:64px;height:64px;border-radius:50%;border:1px solid #fff3}
  .row{display:flex;justify-content:space-between;align-items:center;width:100%;margin:8px 0;background:var(--card);color:var(--text);text-align:left}
  .badge{padding:2px 10px;border-radius:99px;font-size:.8rem}
  .b0{background:var(--ok)} .b1{background:var(--warn)} .b2{background:var(--bad)}
  .err{color:#d99;min-height:1.4em;margin:8px 0 0}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
  ul{padding-left:20px}
  footer{max-width:640px;margin:auto;padding:0 16px 24px}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #c9d6d4;outline-offset:2px}
  .hero{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,#1c2a30,#1a212a)}
  .ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-content:center;text-align:center;line-height:1.1;
        background:radial-gradient(closest-side,#1a212a 74%,transparent 76%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
  .ring b{font-size:1.5rem} .ring span{font-size:.75rem;color:var(--muted)}
  .due{color:#e2cf8f;margin:6px 0 0}
  .strip{display:flex;flex-wrap:wrap;gap:6px;padding:4px 2px}
  .chip.sm{width:22px;height:22px}
  .line{border:1px solid var(--accent);color:var(--accent);width:100%}
  .askrow{display:flex;gap:8px;margin-top:10px} .askrow input{margin:0} .askrow .primary{width:auto;margin:0}
  .note-b{border-top:1px solid var(--line);margin-top:12px;padding-top:8px;white-space:pre-wrap}
  summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
  .call{display:block;text-align:center;margin-top:12px;padding:14px;border:1px solid var(--bad);border-radius:8px;color:var(--text);text-decoration:none}
</style>
</head>
<body>
<div id="app"></div>
<footer id="disc" class="note"></footer>
<script type="module" src="app.js"></script>
</body>
</html>
